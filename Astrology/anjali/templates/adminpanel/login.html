{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Admin Login | Astro Anjali Sharmma</title>

    <link
      rel="stylesheet"
      href="{% static 'assets/vendors/mdi/css/materialdesignicons.min.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/vendors/ti-icons/css/themify-icons.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/vendors/css/vendor.bundle.base.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'assets/vendors/font-awesome/css/font-awesome.min.css' %}"
    />
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}" />
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.png' %}" />

    <style>
      .password-wrapper {
        position: relative;
      }
      .password-wrapper input {
        padding-right: 46px;
      }
      .eye-btn {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #aaa;
        font-size: 18px;
        padding: 0;
        line-height: 1;
      }
      .eye-btn:hover {
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo text-center mb-4">
                  <img
                    src="{% static 'assets/images/favicon.png' %}"
                    alt="Astro Anjali Sharmma"
                    style="
                      width: 150px;
                      height: 150px;
                      border-radius: 30%;
                      border: 3px solid #ffffff;
                      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
                    "
                  />
                </div>
                <h4 class="text-center">Hello! let's get started</h4>
                <h6 class="font-weight-light text-center mb-4">
                  Sign in to continue.
                </h6>

                {% if messages %}
                  {% for message in messages %}
                  <div class="alert alert-danger mt-3 mb-0 py-2">
                    {{ message }}
                  </div>
                  {% endfor %}
                {% endif %}

                <form class="pt-3" method="post" action="{% url 'admin_login' %}">
                  {% csrf_token %}
                  <div class="form-group">
                    <input
                      type="text"
                      name="username"
                      class="form-control form-control-lg"
                      placeholder="Username"
                      required
                      autofocus
                    />
                  </div>

                  <!-- Password field with eye toggle -->
                  <div class="form-group password-wrapper">
                    <input
                      type="password"
                      name="password"
                      id="passwordInput"
                      class="form-control form-control-lg"
                      placeholder="Password"
                      required
                    />
                    <button
                      type="button"
                      class="eye-btn"
                      id="eyeBtn"
                      onclick="togglePassword()"
                      title="Show/Hide Password"
                    >
                      <i class="fa fa-eye" id="eyeIcon"></i>
                    </button>
                  </div>

                  <div class="mt-3 d-grid gap-2">
                    <button
                      type="submit"
                      class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn"
                    >
                      SIGN IN
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="{% static 'assets/vendors/js/vendor.bundle.base.js' %}"></script>
    <script src="{% static 'assets/js/off-canvas.js' %}"></script>
    <script src="{% static 'assets/js/misc.js' %}"></script>
    <script src="{% static 'assets/js/settings.js' %}"></script>
    <script src="{% static 'assets/js/jquery.cookie.js' %}"></script>

    <script>
      function togglePassword() {
        const input   = document.getElementById('passwordInput');
        const icon    = document.getElementById('eyeIcon');
        const isHidden = input.type === 'password';
        input.type     = isHidden ? 'text' : 'password';
        icon.className = isHidden ? 'fa fa-eye-slash' : 'fa fa-eye';
      }
    </script>
  </body>
</html>
